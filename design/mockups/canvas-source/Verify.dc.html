<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Berkeley email code</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/melos/tokens.css">
<link rel="stylesheet" href="ds/melos/components/bundle.css">
<script src="ds/melos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="berkeley" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: var(--font-body); color: #ffffff">
  <div style="position: absolute; inset: 0">
    <dc-import name="Backdrop" object="headphones" theme="berkeley" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 24px 20px 32px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <x-import component-from-global-scope="Melos.Wordmark" size="m"></x-import>
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #dfe6f2">Step 1 of 4</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">Check your Berkeley email</h1>
      <p style="margin: 0; font-size: 17px; line-height: 24px; color: #dfe6f2">We sent a 6 digit code to jordan@berkeley.edu.</p>
      <label for="code-1" style="font-size: 13px; font-weight: 600; color: #dfe6f2">Your code</label>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <input id="code-1" value="4" inputmode="numeric" aria-label="Digit 1" style="height: 56px; min-width: 0; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #fdb515; background: #0f1d33b3; color: #ffffff; font: 700 24px var(--font-display); text-align: center">
        <input value="1" inputmode="numeric" aria-label="Digit 2" style="height: 56px; min-width: 0; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #ffffff7a; background: #0f1d33b3; color: #ffffff; font: 700 24px var(--font-display); text-align: center">
        <input value="7" inputmode="numeric" aria-label="Digit 3" style="height: 56px; min-width: 0; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #ffffff7a; background: #0f1d33b3; color: #ffffff; font: 700 24px var(--font-display); text-align: center">
        <input value="" inputmode="numeric" aria-label="Digit 4" style="height: 56px; min-width: 0; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #ffffff7a; background: #0f1d33b3; color: #ffffff; font: 700 24px var(--font-display); text-align: center">
        <input value="" inputmode="numeric" aria-label="Digit 5" style="height: 56px; min-width: 0; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #ffffff7a; background: #0f1d33b3; color: #ffffff; font: 700 24px var(--font-display); text-align: center">
        <input value="" inputmode="numeric" aria-label="Digit 6" style="height: 56px; min-width: 0; box-sizing: border-box; border-radius: 10px; border: 1.5px solid #ffffff7a; background: #0f1d33b3; color: #ffffff; font: 700 24px var(--font-display); text-align: center">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 8px">
        <x-import component-from-global-scope="Melos.Button" variant="primary" block="{{yes}}">Continue</x-import>
        <x-import component-from-global-scope="Melos.Button" variant="quiet" block="{{yes}}">Send a new code</x-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>

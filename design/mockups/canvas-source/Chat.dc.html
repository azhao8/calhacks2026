<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with Maya</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/melos/tokens.css">
<link rel="stylesheet" href="ds/melos/components/bundle.css">
<script src="ds/melos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="berkeley" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: var(--font-body); color: #ffffff">
  <div style="position: absolute; inset: 0">
    <dc-import name="Backdrop" object="none" theme="berkeley" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: #0a142680"></div>
  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 24px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p style="margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700">Maya</p>
        <p style="margin: 0; font-size: 13px; font-weight: 600; color: #dfe6f2">Fri at The UC Theatre</p>
      </div>
      <button type="button" aria-label="Open menu" style="width: 48px; height: 48px; padding: 0; border-radius: 999px; border: 1px solid #ffffff3d; background: #0f1d3359; color: #ffffff; display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(14px)"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h10"></path></svg></button>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px">
      <x-import component-from-global-scope="Melos.ChatBubble" from="system">You and Maya are going Friday</x-import>
      <x-import component-from-global-scope="Melos.ChatBubble" from="them" name="Maya" time="6:02 pm">hey! are you getting there early for the opener?</x-import>
      <x-import component-from-global-scope="Melos.ChatBubble" from="me" time="6:04 pm">Yes, I heard they are really good live. See you at 8:10</x-import>
      <x-import component-from-global-scope="Melos.ChatBubble" from="them" name="Maya" time="11:48 pm">that was so fun. want to stay in touch?</x-import>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <x-import component-from-global-scope="Melos.ConnectorButton" kind="instagram"></x-import>
      <x-import component-from-global-scope="Melos.ConnectorButton" kind="phone"></x-import>
      <x-import component-from-global-scope="Melos.Button" variant="quiet">Not now</x-import>
    </div>
    <label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message Maya</label>
    <input id="chat-input" placeholder="Message Maya" style="min-height: 48px; box-sizing: border-box; padding: 10px 18px; border-radius: 999px; border: 1.5px solid #ffffff7a; background: #0d1830cc; color: #ffffff; font: 17px var(--font-body)">
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

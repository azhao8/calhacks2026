<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your school</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/melos/tokens.css">
<link rel="stylesheet" href="ds/melos/components/bundle.css">
<script src="ds/melos/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Figtree:wght@400..700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="base" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: var(--font-body); color: #ffffff">
  <div style="position: absolute; inset: 0">
    <dc-import name="Backdrop" object="speaker" theme="base" hint-size="390px,844px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 24px 20px 32px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 20px">
      <x-import component-from-global-scope="Melos.Wordmark" size="m"></x-import>
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">Where do you go to school?</h1>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <x-import component-from-global-scope="Melos.SchoolPicker" schools="{{schools}}" value="berkeley"></x-import>
      <x-import component-from-global-scope="Melos.Button" variant="primary" block="{{yes}}">Continue</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      schools: [
        { id: 'berkeley', name: 'UC Berkeley', city: 'Berkeley, CA', colors: ['#003262', '#fdb515'] },
        { id: 'ucla', name: 'UCLA', status: 'soon', colors: ['#2774ae', '#ffd100'] },
        { id: 'stanford', name: 'Stanford', status: 'soon', colors: ['#8c1515', '#ffffff'] }
      ]
    };
  }
}
</script>
</body>
</html>

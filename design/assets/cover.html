<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Melos</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--canvas); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--surface-brand); }
  .slab { fill:var(--canvas-glow-b); rx:var(--radius-lg); }
  .warm { fill:var(--canvas-glow-c); }
  .gold { fill:var(--accent); }
  .pill { fill:var(--accent); rx:var(--radius-pill); }
  .spindle { fill:var(--canvas); }
  .groove { fill:none; stroke:var(--line-strong); stroke-width:1.5; }
  .words { position:absolute; left:24px; bottom:24px; max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.92; font-weight:800; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:8px 0 0 6px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      surface-brand disc r184 bleeding off the right edge (the school's brand region, largest) · canvas-glow-b slab 120x208 · accent label r48 and accent pill 48x48 · canvas-glow-c quarter round 72 · about 40% of 960x288
  arrangement one big record bleeding off the right with two satellites on its left, slab and pill bottoms on one line space-6 above the edge
  pattern     literal motif, a record: four groove arcs in line-strong across the disc, chosen because Melos turns listening into a night out
  scales      sides in space-6 and space-12 multiples; gaps space-4; slab corners radius-lg; pill rx radius-pill (half of 48); groove pitch space-6
-->
<circle class="brand" cx="372" cy="144" r="184"/>
<circle class="groove" cx="372" cy="144" r="160"/>
<circle class="groove" cx="372" cy="144" r="136"/>
<circle class="groove" cx="372" cy="144" r="112"/>
<circle class="groove" cx="372" cy="144" r="88"/>
<circle class="gold" cx="372" cy="144" r="48"/>
<circle class="spindle" cx="372" cy="144" r="6"/>
<rect class="slab" x="16" y="56" width="120" height="208" rx="24"/>
<path class="warm" d="M16 0 h72 a72 72 0 0 1 -72 72 z"/>
<rect class="pill" x="152" y="216" width="48" height="48" rx="24"/>
</svg>
</div>
<div class="words">
<h1 class="name">Melos</h1>
<p class="tag">Your Spotify, turned into plans.</p>
</div>
</div>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="berkeley">
<head><meta charset="utf-8"><title>Button</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Melos, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h('div', { className: 'ml-stack', style: { padding: '16px', maxWidth: '40rem' } },
  h('div', { className: 'ml-row' },
    h(M.Button, { variant: 'primary' }, 'Accept'),
    h(M.Button, { variant: 'secondary' }, 'Next time'),
    h(M.Button, { variant: 'quiet', icon: 'spark' }, 'Surprise me')),
  h('div', { className: 'ml-row' },
    h(M.Button, { variant: 'secondary', pressed: true, icon: 'check' }, 'You can make it'),
    h(M.Button, { variant: 'primary', loading: true }, 'Saving'),
    h(M.Button, { variant: 'primary', disabled: true }, 'Continue'))));
</script>
</body>
</html>

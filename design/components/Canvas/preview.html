<!doctype html>
<html lang="en" data-theme="berkeley">
<head><meta charset="utf-8"><title>Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Melos, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
var dots = "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><circle cx='4' cy='4' r='2' fill='%23fdb515'/></svg>\")";
root.render(h('div', { className: 'ml-demo' },
  h(M.Canvas, { school: 'berkeley', pattern: dots, actions: h(M.Button, { variant: 'secondary', 'aria-label': 'Your profile' }, 'J') },
    h('p', { className: 'ml-caption' }, 'Your week at Berkeley'),
    h('h1', { className: 'ml-display' }, 'Three shows fit your taste'),
    h(M.Button, { variant: 'primary', block: true }, 'See this week')),
  h(M.Canvas, { school: 'base' },
    h('p', { className: 'ml-caption' }, 'Before you pick a school'),
    h('h1', { className: 'ml-display' }, 'Your Spotify, turned into plans'),
    h(M.Button, { variant: 'primary', block: true }, 'Get started'))));
</script>
</body>
</html>

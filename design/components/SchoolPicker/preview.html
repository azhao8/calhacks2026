<!doctype html>
<html lang="en" data-theme="berkeley">
<head><meta charset="utf-8"><title>SchoolPicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Melos, h = React.createElement, root = ReactDOM.createRoot(document.getElementById('root'));
function Demo() {
  var s = React.useState('berkeley');
  return h('div', { style: { padding: '16px', maxWidth: '24rem' } }, h(M.SchoolPicker, { query: '', value: s[0], onChange: s[1], schools: [
    { id: 'berkeley', name: 'UC Berkeley', city: 'Berkeley, CA', colors: ['#003262', '#fdb515'] },
    { id: 'ucla', name: 'UCLA', status: 'soon', colors: ['#2774ae', '#ffd100'] },
    { id: 'stanford', name: 'Stanford', status: 'soon', colors: ['#8c1515', '#ffffff'] }] }));
}
root.render(h(Demo));
</script>
</body>
</html>
